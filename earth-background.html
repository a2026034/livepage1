<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Earth background</title>
<style>
  :root {
    --page-bg: #0e1730;
    --page-fg: #e6ebf8;
    --earth-opacity: .8; /* 地球全体の濃さ。もっと薄くしたいならここを下げる */
  }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--page-bg);
    color: var(--page-fg);
    font-family: "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  }

  /* ▼ 背景の地球(これをサイトにコピー) */
  #earth-bg {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    z-index: -1; pointer-events: none;
    opacity: var(--earth-opacity);
  }
  /* ▲ ここまで */

  main { min-height: 100%; display: grid; place-content: center; padding: 2rem; text-align: center; }
  main h1 { font-weight: 500; letter-spacing: .04em; margin: 0 0 .5rem; }
  main p { margin: 0; opacity: .7; }
</style>
</head>
<body>

<canvas id="earth-bg" aria-hidden="true"></canvas>
<main>
  <h1>-</h1>
  <p>-</p>
</main>

<script src="earth.js"></script>
</body>
</html>
